name: publish

on:
  push:
    tags:
      - "v*"
  # Manual run: re-run the pipeline for a version whose tagged run failed before
  # the publish step. It cannot create a brand-new package — trusted publishing
  # attaches to a package page that must exist first — so the first publish is
  # done once by a maintainer from a logged-in machine:
  #   npm login && npm run build && npm publish
  # Everything after that is this workflow.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  npm:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Verify version matches tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$pkg expected but pushed v$tag"
            exit 1
          fi

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test && npm run typecheck

      # Same rule as the orchestrator's: re-tagging is a legitimate repair, and
      # npm rejects a version that already exists. Skip that step, keep the run
      # green, and let the release job refresh the page instead.
      - name: Check whether this version is already on npm
        id: on-npm
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "@dahch/muninn@$version" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::@dahch/muninn@$version is already published; skipping the publish step."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.on-npm.outputs.exists != 'true'
        run: |
          version="$(node -p "require('./package.json').version")"
          if [[ "$version" == *-* ]]; then
            npm publish --provenance --tag next
          else
            npm publish --provenance
          fi

  release:
    # A green publish is not a release: the tag needs its notes too.
    needs: npm
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          awk -v v="$version" '
            BEGIN { p = 0 }
            $0 == "## " v { p = 1; next }
            p && /^## / { exit }
            p { print }
          ' CHANGELOG.md > notes.md
          flags=(--title "$TAG")
          case "$version" in *-*) flags+=(--prerelease) ;; esac
          if [ -s notes.md ]; then
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release edit "$TAG" "${flags[@]}" --notes-file notes.md
            else
              gh release create "$TAG" --verify-tag "${flags[@]}" --notes-file notes.md
            fi
          elif gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::no changelog section for $version; leaving the existing release alone"
          else
            gh release create "$TAG" --verify-tag "${flags[@]}" --generate-notes
          fi
